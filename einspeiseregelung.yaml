alias: Nulleinspeisung / Einspeiseregelung
description: >
  powermeter = zusaetzlicher Bedarf (Netzbezug) aus
  sensor.lesekopf_sensor_lesekopf_2_min_mittelwert_stromzahler

  Regelung auf die Bandmitte target=100 W in einem Schritt:
    ausserhalb 80-120 W -> new_preset = actual_preset + (powermeter - 100),
    auf base=10 W abgerundet und auf 80..800 W begrenzt.
    innerhalb 80-120 W -> halten (Hysterese, kein Schreibvorgang).
  Modus: charge_first wenn heruntergeregelt auf min_preset, sonst
  charge_discharge ab 100 W.

  Fruehere Schrittsuche (step_up=100 / step_down=50) entfernt: step_up war
  groesser als das Hystereseband (40 W) und hat bei jeder  Aufwaertskorrektur
  ueberschwungen, ausserdem gab es eine Totzone zwischen 81 und 109 W.

  Vorbedingung: powermeter, Preset und Modus muessen verfuegbar sein (siehe
  Bedingungen).
triggers:
  - trigger: time_pattern
    minutes: /2
  - trigger: numeric_state
    entity_id:
      - sensor.lesekopf_sensor_lesekopf_2_min_mittelwert_stromzahler
    below: -100
conditions:
  - condition: not
    conditions:
      - condition: state
        entity_id: sensor.lesekopf_sensor_lesekopf_2_min_mittelwert_stromzahler
        state:
          - unavailable
          - unknown
      - condition: state
        entity_id: number.solarkraftwerk_discharge_power_slot_1
        state:
          - unavailable
          - unknown
      - condition: state
        entity_id: select.solarkraftwerk_operating_mode
        state:
          - unavailable
          - unknown
  - condition: or
    conditions:
      - condition: numeric_state
        entity_id: sensor.solarkraftwerk_battery
        above: 10
      - condition: sun
        after: sunrise
        before: sunset
actions:
  - variables:
      base: 10
      min_preset: 80
      max_preset: 800
      target: 100
      lower_threshold: 80
      upper_threshold: 120
      powermeter: >
        {{
        states('sensor.lesekopf_sensor_lesekopf_2_min_mittelwert_stromzahler')
        | float }}
      actual_preset: >
        {{ states('number.solarkraftwerk_discharge_power_slot_1') |
        float }}
      actual_mode: |
        {{ states('select.solarkraftwerk_operating_mode') }}
      new_preset: |
        {% if lower_threshold <= powermeter <= upper_threshold %}
          {{ actual_preset | int }}
        {% else %}
          {% set raw = actual_preset + powermeter - target %}
          {% set q = (raw / base) | round(0, 'floor') * base %}
          {{ [ [ q, max_preset ] | min, min_preset ] | max | int }}
        {% endif %}
      target_mode: >
        {% if powermeter < lower_threshold and (new_preset | int) == min_preset
        %}
          charge_first
        {% elif (new_preset | int) >= 100 %}
          charge_discharge
        {% endif %}
  - if:
      - condition: template
        value_template: |
          {{ target_mode | trim != '' and target_mode | trim != actual_mode }}
    then:
      - action: select.select_option
        target:
          entity_id: select.solarkraftwerk_operating_mode
        data:
          option: '{{ target_mode | trim }}'
  - if:
      - condition: template
        value_template: |
          {{ (new_preset | int) != (actual_preset | int) }}
    then:
      - action: number.set_value
        target:
          entity_id:
            - number.solarkraftwerk_discharge_power_slot_1
        data:
          value: '{{ new_preset | int }}'
mode: single
max_exceeded: silent
